<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 32 532 380" role="img"
     aria-label="Cross-section of an AMI digester. Gas lances suspended from a top manifold inject recirculated biogas into the tank, mixing the contents with no moving parts. Feedstock enters low on the left, digested sludge leaves on the right, and biogas is drawn from the dome.">
  <style>
    .ln  { fill:none; stroke:#085cce; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    .ln2 { fill:none; stroke:#085cce; stroke-width:1; opacity:.75; }
    .fill{ fill:#e3ecfb; }
    .bub { fill:#085cce; opacity:.45; }
    .surf{ fill:none; stroke:#085cce; stroke-width:1; stroke-dasharray:4 4; opacity:.55; }
    .num { fill:#085cce; font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace; font-size:11px; font-weight:500; }
    .ring{ fill:#fff; stroke:#085cce; stroke-width:1.2; }
    .lead{ fill:none; stroke:#085cce; stroke-width:.8; opacity:.5; }
    @media (prefers-reduced-motion: no-preference){
      .lance{ stroke-dasharray:220; stroke-dashoffset:220; animation:d .9s ease forwards .3s; }
      .lance:nth-child(2n){ animation-delay:.45s }
      .lance:nth-child(3n){ animation-delay:.6s }
      @keyframes d { to { stroke-dashoffset:0 } }
    }
  </style>

  <!-- vessel -->
  <path class="fill" d="M190 130 H430 V330 L340 398 H280 L190 330 Z"/>
  <path class="ln" d="M190 130 V330 L280 398 H340 L430 330 V130"/>

  <!-- heated wall (4) -->
  <path class="ln2" d="M182 138 V322 M438 138 V322"/>
  <g class="ln2">
    <path d="M182 158 l8 -6 M182 190 l8 -6 M182 222 l8 -6 M182 254 l8 -6 M182 286 l8 -6"/>
    <path d="M438 158 l-8 -6 M438 190 l-8 -6 M438 222 l-8 -6 M438 254 l-8 -6 M438 286 l-8 -6"/>
  </g>

  <!-- dome (1) + manifold -->
  <path class="fill" d="M206 130 Q310 66 414 130 Z" opacity=".7"/>
  <path class="ln" d="M206 130 Q310 66 414 130"/>
  <line class="ln" x1="206" y1="130" x2="414" y2="130"/>

  <line class="surf" x1="196" y1="158" x2="424" y2="158"/>

  <!-- lances -->
  <g>
    <path class="ln lance" d="M222 130 V312 m-7 0 h14"/>
    <path class="ln lance" d="M244 130 V312 m-7 0 h14"/>
    <path class="ln lance" d="M266 130 V312 m-7 0 h14"/>
    <path class="ln lance" d="M288 130 V312 m-7 0 h14"/>
    <path class="ln lance" d="M310 130 V312 m-7 0 h14"/>
    <path class="ln lance" d="M332 130 V312 m-7 0 h14"/>
    <path class="ln lance" d="M354 130 V312 m-7 0 h14"/>
    <path class="ln lance" d="M376 130 V312 m-7 0 h14"/>
    <path class="ln lance" d="M398 130 V312 m-7 0 h14"/>
  </g>

  <!-- bubbles -->
  <g class="bub">
    <circle cx="233" cy="292" r="2.3"/><circle cx="236" cy="258" r="2"/><circle cx="232" cy="220" r="2.6"/><circle cx="235" cy="184" r="1.7"/>
    <circle cx="289" cy="298" r="2.2"/><circle cx="286" cy="262" r="2.6"/><circle cx="290" cy="224" r="2"/><circle cx="287" cy="188" r="2.3"/>
    <circle cx="343" cy="290" r="2.6"/><circle cx="346" cy="252" r="2"/><circle cx="342" cy="216" r="2.4"/><circle cx="345" cy="182" r="1.7"/>
    <circle cx="387" cy="296" r="2"/><circle cx="384" cy="258" r="2.5"/><circle cx="388" cy="222" r="2"/><circle cx="385" cy="186" r="2.2"/>
  </g>

  <!-- biogas out (7) -->
  <path class="ln" d="M310 112 V58 H150"/>
  <path class="ln" d="M150 58 l8 -5 M150 58 l8 5"/>

  <!-- recirculation loop (3): headspace -> pump -> tank base -->
  <path class="ln" d="M206 108 H120 V300"/>
  <circle class="ring" cx="120" cy="312" r="12"/>
  <path class="ln2" d="M114 312 h12 M120 306 v12"/>
  <path class="ln" d="M120 324 V350 H190"/>
  <path class="ln" d="M190 350 l-8 -5 M190 350 l-8 5"/>

  <!-- feedstock in (5) -->
  <path class="ln" d="M104 232 H190"/>
  <path class="ln" d="M190 232 l-8 -5 M190 232 l-8 5"/>

  <!-- digested out (6) -->
  <path class="ln" d="M430 296 H512"/>
  <path class="ln" d="M512 296 l-8 -5 M512 296 l-8 5"/>

  <!-- callouts -->
  <g>
    <circle class="ring" cx="452" cy="88" r="9"/><text class="num" x="452" y="92" text-anchor="middle">1</text>
    <line class="lead" x1="444" y1="92" x2="392" y2="108"/>
    <circle class="ring" cx="486" cy="200" r="9"/><text class="num" x="486" y="204" text-anchor="middle">2</text>
    <line class="lead" x1="477" y1="200" x2="400" y2="200"/>
    <circle class="ring" cx="90" cy="352" r="9"/><text class="num" x="90" y="356" text-anchor="middle">3</text>
    <line class="lead" x1="99" y1="349" x2="120" y2="330"/>
    <circle class="ring" cx="486" cy="252" r="9"/><text class="num" x="486" y="256" text-anchor="middle">4</text>
    <line class="lead" x1="477" y1="252" x2="440" y2="252"/>
    <circle class="ring" cx="80" cy="232" r="9"/><text class="num" x="80" y="236" text-anchor="middle">5</text>
    <circle class="ring" cx="528" cy="296" r="9"/><text class="num" x="528" y="300" text-anchor="middle">6</text>
    <circle class="ring" cx="134" cy="58" r="9"/><text class="num" x="134" y="62" text-anchor="middle">7</text>
  </g>
</svg>
